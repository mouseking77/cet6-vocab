<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d1017; --bg2:#141926; --card:#181e2c; --card2:#1f2637;
  --line:#2a3346; --txt:#e8ecf5; --dim:#8b96ad; --dim2:#5f6a80;
  --acc:#7c6cff; --acc2:#38bdf8; --ok:#34d399; --warn:#fbbf24; --bad:#fb7185;
  --r:18px; --shadow:0 10px 30px rgba(0,0,0,.35);
}
html[data-theme="light"]{
  --bg:#f6f7fb; --bg2:#eef1f8; --card:#ffffff; --card2:#f4f6fc;
  --line:#e2e7f2; --txt:#151a26; --dim:#5d6780; --dim2:#8b96ad;
  --shadow:0 8px 24px rgba(20,30,60,.10);
}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(700px 380px at 85% -8%,rgba(124,108,255,.20),transparent 70%),
    radial-gradient(600px 320px at 5% 0%,rgba(56,189,248,.12),transparent 70%);
}
#app{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:14px 16px calc(86px + env(safe-area-inset-bottom));min-height:100vh}
nav#tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:flex;justify-content:center;gap:6px;
}
nav#tabs button{
  flex:1;max-width:130px;background:none;border:0;color:var(--dim);
  font:inherit;font-size:11px;line-height:1.2;padding:6px 2px;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;
}
nav#tabs button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav#tabs button.on{color:var(--acc)}
nav#tabs button.on svg{stroke:var(--acc)}
h1,h2,h3,p{margin:0}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.muted{color:var(--dim);font-size:13px}
.mini{color:var(--dim2);font-size:12px}
.pagehead{display:flex;align-items:baseline;gap:8px;margin:6px 0 14px}
.pagehead h2{font-size:19px;letter-spacing:.3px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:12px;color:var(--dim)}
.btn{
  appearance:none;border:1px solid var(--line);background:var(--card2);color:var(--txt);
  font:inherit;font-size:15px;font-weight:600;padding:13px 16px;border-radius:14px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .06s ease,filter .15s;
}
.btn:active{transform:scale(.985)}
.btn.primary{background:linear-gradient(135deg,var(--acc),#5b8cff);border-color:transparent;color:#fff;box-shadow:0 8px 20px rgba(110,100,255,.30)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ring{--p:0;width:74px;height:74px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--card2) 0);position:relative}
.ring::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--card)}
.ring b{position:relative;z-index:1;font-size:15px;font-variant-numeric:tabular-nums}
.ring b i{font-style:normal;font-size:10px;color:var(--dim)}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi div{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.kpi b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;color:var(--dim)}
/* study */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-height:34px}
.bar{height:6px;border-radius:99px;background:var(--card2);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:width .25s}
.qcard{padding:22px 18px 18px;text-align:center;position:relative;overflow:hidden}
.qcard::after{content:"";position:absolute;inset:-40% -10% auto auto;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(124,108,255,.16),transparent 65%);pointer-events:none}
.qpos{font-size:12px;color:var(--acc2);letter-spacing:.4px}
.qzh{font-size:27px;font-weight:700;line-height:1.35;margin:8px 0 2px;letter-spacing:.5px}
.qw{font-size:33px;font-weight:800;line-height:1.2;margin:10px 0 2px;letter-spacing:.4px;
  color:var(--acc2);word-break:break-word}
.qsub{font-size:13px;color:var(--dim);margin-top:6px;word-break:break-word}
.mask{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin:18px 0 6px;cursor:text;touch-action:manipulation}
.wd{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:100%}
.sc{width:20px;height:28px;border-radius:7px;background:var(--card2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:15px;font-weight:700;color:var(--txt)}
.sc.f{background:rgba(56,189,248,.15);border-color:rgba(56,189,248,.55);color:var(--acc2)}
.mask.dense .sc{width:15px;height:26px;font-size:13px;border-radius:6px}
.mask.dense .wd{gap:3px}
.punct{color:var(--dim2);font-size:15px;display:grid;place-items:center;height:28px}
.stage{display:grid;place-items:center;min-height:calc(100vh - 190px);min-height:calc(100dvh - 190px)}
.stage>.card{width:100%}
input[type=text]{
  width:100%;background:var(--bg2);border:1.5px solid var(--line);color:var(--txt);
  font:inherit;font-size:19px;letter-spacing:.5px;padding:14px 14px;border-radius:14px;outline:none;text-align:center;
}
input[type=text]:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(124,108,255,.18)}
.ans{font-size:31px;font-weight:800;letter-spacing:.5px;line-height:1.25;word-break:break-word;color:var(--ok)}
.ans.bad{color:var(--bad)}
.ans.warn{color:var(--warn)}
.pho{color:var(--dim);font-size:14px;margin-top:6px}
.selfrate{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}
.selfrate button{
  border:1.5px solid var(--line);background:var(--card2);color:var(--txt);border-radius:14px;
  padding:12px 6px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;position:relative;
}
.selfrate button small{display:block;font-weight:500;font-size:10.5px;color:var(--dim);margin-top:3px}
.selfrate button.sug{outline:2px solid var(--acc);outline-offset:1px}
.selfrate .k{border-color:rgba(52,211,153,.45)}
.selfrate .k small{color:var(--ok)}
.selfrate .f{border-color:rgba(251,191,36,.4)}
.selfrate .f small{color:var(--warn)}
.selfrate .u{border-color:rgba(251,113,133,.4)}
.selfrate .u small{color:var(--bad)}
.wrongline{font-size:14px;color:var(--dim);margin-top:10px}
.wrongline s{color:var(--bad);text-decoration-thickness:1px}
.speak{border:1px solid var(--line);background:var(--card2);border-radius:999px;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;color:var(--txt);flex:none}
.speak svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.listenbig{display:grid;place-items:center;gap:10px;padding:8px 0 4px}
.listenbig .speak{width:82px;height:82px;background:linear-gradient(135deg,var(--acc),#4f7dff)}
.listenbig .speak svg{width:34px;height:34px;stroke:#fff}
/* list */
.list{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;display:flex;gap:10px;align-items:center}
.item .w{font-weight:700;font-size:16px}
.item .z{font-size:12.5px;color:var(--dim);margin-top:2px}
.badge{font-size:10px;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--dim);flex:none}
.badge.w{color:var(--warn);border-color:rgba(251,191,36,.4)}
.badge.u{color:var(--bad);border-color:rgba(251,113,133,.4)}
.badge.k{color:var(--ok);border-color:rgba(52,211,153,.4)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:12.5px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card2);color:var(--dim);cursor:pointer}
.chip.on{background:var(--acc);border-color:transparent;color:#fff}
.empty{text-align:center;color:var(--dim);padding:46px 10px;font-size:14px}
.srow{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow select,.srow input[type=number]{background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;color:var(--dim);font:inherit;font-size:13px;padding:7px 12px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--card2);border:1px solid var(--line);color:var(--txt);padding:10px 16px;border-radius:12px;font-size:13px;
  box-shadow:var(--shadow);z-index:40;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
.done-wrap{text-align:center;padding:16px 6px}
.done-wrap .big{font-size:54px;line-height:1;margin-bottom:12px}
.done-wrap h2{font-size:22px;margin-bottom:6px}
</style>

function lev(a, b) {
  if (a === b) return 0;
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = new Array(n + 1), cur = new Array(n + 1);
  for (let j = 0; j <= n; j++) prev[j] = j;
  for (let i = 1; i <= m; i++) {
    cur[0] = i;
    for (let j = 1; j <= n; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);

    [prev, cur] = [cur, prev];
  }
  return prev[n];

  const inp = compact(input);

  let best = answers[0], bestD = 1e9, exact = false;
  for (const a of answers) {

    if (d < bestD) { bestD = d; best = a; }

  else if (g === 'fuzzy') { s.box = Math.min(s.box || 0, 2); s.d = Date.now() + Math.round(0.5 * DAY); }
  else { s.ng = (s.ng || 0) + 1; s.box = 0; s.d = Date.now() + 60000; }
  db.items[id] = s;
  const lg = logToday();
  lg.done++;
  if (g === 'known') lg.ok++; else if (g === 'unknown') lg.ng++;
  save();
}

/* ---------------- session ---------------- */
const S = { view: 'home', q: null, revealed: false, session: null, typed: '', libFilter: 'all', libQuery: '', wrongLimit: 0 };

function buildQueue(limit, onlyWrong) {
  const now = Date.now();
  let pool = ITEMS;
  if (onlyWrong) pool = ITEMS.filter(it => isWrong(it.id));
  const overdue = [], fresh = [];
  for (const it of pool) {
    const s = db.items[it.id];
    if (!s) fresh.push(it.id);
    else if (s.d <= now) overdue.push({ id: it.id, d: s.d, ng: s.ng || 0 });
  }
  overdue.sort((a, b) => (b.ng - a.ng) || (a.d - b.d));
  const ids = [];
  for (const o of overdue) { if (ids.length >= limit) break; ids.push(o.id); }
  for (const id of fresh) { if (ids.length >= limit) break; ids.push(id); }
  return ids;
}
function startSession(opts) {
  const limit = opts.limit || db.set.goal || 20;
  const ids = buildQueue(limit, !!opts.onlyWrong);
  if (!ids.length) { S.view = opts.onlyWrong ? 'wrong' : 'home'; toast(opts.onlyWrong ? '没有需要重刷的错词' : '今天的量已完成，明天再来'); render(); return; }
  const fresh = ids.filter(isNew);
  const preview = !opts.onlyWrong && db.set.learnFirst !== false && fresh.length > 0;
  S.session = {
    ids, i: 0, ok: 0, ng: 0, rep: {}, onlyWrong: !!opts.onlyWrong, started: ids.length,
    phase: preview ? 'learn' : 'test', learnIds: preview ? fresh : [], li: 0
  };
  S.view = 'study';
  if (preview) { S.phase = 'learn'; render(); learnSpeak(); }
  else nextQ();
}
function learnSpeak() {
  const ss = S.session;
  if (!ss || ss.phase !== 'learn') return;
  const it = BY_ID[ss.learnIds[ss.li]];
  if (it) speakWord(it);
}
function learnStep(delta) {
  const ss = S.session;
  if (!ss || ss.phase !== 'learn') return;
  ss.li += delta;
  if (ss.li < 0) ss.li = 0;
  if (ss.li >= ss.learnIds.length) { startTestPhase(); return; }
  render();
  if (db.set.autoSpeak) learnSpeak();
}
function startTestPhase() {
  const ss = S.session;
  if (!ss) return;
  ss.phase = 'test'; ss.li = 0;
  nextQ();
}
function nextQ() {
  const ss = S.session;
  if (!ss) { S.view = 'home'; render(); return; }
  if (ss.i >= ss.ids.length) { S.view = 'done'; S.q = null; render(); return; }
  const id = ss.ids[ss.i];
  const it = BY_ID[id];
  S.q = it; S.revealed = false; S.typed = ''; S.judgeRes = null;
  render();
  if (db.set.mode === 'listen') speakWord(it);
  setTimeout(() => { const el = document.getElementById('answer'); if (el && !isTouch) el.focus(); }, 60);
}
const isTouch = matchMedia('(hover:none)').matches;
function submitAnswer() {
  const ss = S.session, it = S.q;
  if (!ss || !it || S.revealed) return;
  const res = judge(S.typed, it.ans);
  S.judgeRes = res;
  S.revealed = true;
  ss.answered = true;
  render();
  if (db.set.autoSpeak) speakWord(it);
}
function rate(g) {
  const ss = S.session, it = S.q;
  if (!ss || !it) return;
  grade(it.id, g);
  if (g === 'known') ss.ok++; else if (g === 'unknown') { ss.ng++; ss.rep[it.id] = (ss.rep[it.id] || 0) + 1; }
  const needRepeat = g === 'unknown' && (ss.rep[it.id] || 0) < 2;
  if (needRepeat) {
    const at = Math.min(ss.ids.length, ss.i + 4);
    ss.ids.splice(at, 0, it.id);
  }
  ss.i++;
  nextQ();
}

function ringHTML(done, goal) {

}
function statNums() {
  let learned = 0, mastered = 0, wrong = 0, due = 0;
  const now = Date.now();
  for (const it of ITEMS) {
    const s = db.items[it.id];
    if (s) { learned++; if (s.box >= 3) mastered++; if (s.ng > 0 && s.box < 3) wrong++; if (s.d <= now) due++; }
  }
  return { learned, mastered, wrong, due, total: ITEMS.length };
}
function streak() {
  let n = 0;
  const d = new Date();

    const lg = db.log[k];
    if (lg && lg.done > 0) n++;
    else if (i > 0) break;
    d.setDate(d.getDate() - 1);

  return n;
}

  </div>

    素材来源：六级考前冲刺 600 词 · 六级高频同义替换 · 四六级翻译重点词汇<br>共 ${ITEMS.length} 条，离线可用<br>
    版本 ${esc(VERSION)}
  </div>`;
}
const ICON_SPEAK = '<svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/></svg>';

/* ---------------- render ---------------- */
function render() {
  const app = document.getElementById('app');
  const v = S.view;
  const learning = v === 'study' && S.session && S.session.phase === 'learn';
  let html = '';
  if (v === 'home') html = viewHome();
  else if (v === 'study') html = learning ? viewLearn() : viewStudy();
  else if (v === 'wrong') html = viewWrong();
  else if (v === 'lib') html = viewLib();
  else if (v === 'settings') html = viewSettings();
  else if (v === 'done') html = viewDone();
  app.innerHTML = html;
  renderTabs();
  if (learning) {
    window.onkeydown = e => {
      if (e.key === 'Enter' || e.key === 'ArrowRight') { e.preventDefault(); learnStep(1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); learnStep(-1); }
    };
  } else if (v === 'study' && S.revealed) {
    window.onkeydown = e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); rate(suggestKey()); }
      else if (e.key === 'ArrowLeft') rate('unknown');
      else if (e.key === 'ArrowRight') rate('known');
    };
  } else if (v === 'study') {
    window.onkeydown = e => {
      if (e.key === 'Enter') { e.preventDefault(); submitAnswer(); }
    };
  } else {
    window.onkeydown = null;
  }
}
function suggestKey() {
  const r = S.judgeRes;
  if (!r) return 'unknown';
  return r.level === 'correct' ? 'known' : (r.level === 'near' ? 'fuzzy' : 'unknown');
}
function renderTabs() {
  const nav = document.getElementById('tabs');
  const cur = S.view === 'study' || S.view === 'done' ? 'home' : S.view;
  const items = [
    ['home', '学习', '<svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5V21"/>'],
    ['wrong', '错词', '<svg viewBox="0 0 24 24"><path d="m4 8 6 6 10-10"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h8"/></svg>'],
    ['lib', '词库', '<svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M14 3v6h6"/></svg>'],
    ['settings', '设置', '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>']
  ];
  nav.innerHTML = items.map(([k, label, svg]) => `<button data-tab="${k}" class="${cur === k ? 'on' : ''}">${svg}<span>${label}</span></button>`).join('');
}

/* ---------------- toast ---------------- */
let toastT = 0;
function toast(msg) {
  let el = document.querySelector('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('on'), 1800);
}

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-tab],[data-mode],[data-goal],[data-rate],[data-src],[data-theme],[data-autospeak],[data-learnfirst]');
  if (!t) return;
  if (t.dataset.tab) {
    S.view = t.dataset.tab;
    if (S.view !== 'study') S.session = S.session;
    render();
    window.scrollTo(0, 0);
    return;
  }
  if (t.dataset.mode) {
    if (t.dataset.mode === 'listen' && !('speechSynthesis' in window)) { toast('这个浏览器不支持朗读，请用「看中文拼写」'); return; }
    db.set.mode = t.dataset.mode; save(); render(); return;
  }
  if (t.dataset.goal) { db.set.goal = +t.dataset.goal; save(); render(); return; }
  if (t.dataset.rate) { rate(t.dataset.rate); return; }
  if (t.dataset.src) { S.libFilter = t.dataset.src; render(); return; }
  if (t.dataset.theme) { db.set.theme = t.dataset.theme; save(); applyTheme(); render(); return; }
  if (t.dataset.autospeak) { db.set.autoSpeak = t.dataset.autospeak === '1'; save(); render(); return; }
  if (t.dataset.learnfirst) { db.set.learnFirst = t.dataset.learnfirst === '1'; save(); render(); return; }
  const act = t.dataset.act;
  if (act === 'start') startSession({});
  else if (act === 'start-wrong') startSession({ onlyWrong: true, limit: 999 });
  else if (act === 'learn-next') learnStep(1);
  else if (act === 'learn-prev') learnStep(-1);
  else if (act === 'learn-skip') startTestPhase();
  else if (act === 'submit') { const el = document.getElementById('answer'); S.typed = el ? el.value : S.typed; submitAnswer(); }
  else if (act === 'skip') { S.typed = ''; S.judgeRes = { level: 'wrong', best: S.q.label }; S.revealed = true; render(); if (db.set.autoSpeak) speakWord(S.q); }
  else if (act === 'speak') { if (S.session && S.session.phase === 'learn') learnSpeak(); else if (S.q) speakWord(S.q); }
  else if (act === 'focus-input') {
    const el = document.getElementById('answer');
    if (el) { el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {} }
  }
  else if (act === 'speak-item') { const it = BY_ID[t.dataset.id]; if (it) speakWord(it); }
  else if (act === 'quit') { S.view = 'home'; S.session = null; S.q = null; render(); }
  else if (act === 'again') { startSession({}); }
  else if (act === 'goview') { S.view = t.dataset.view; render(); }
  else if (act === 'rm') {
    const s = db.items[t.dataset.id];
    if (s) { s.ng = 0; s.box = Math.max(s.box, 3); save(); }
    render();
  }
  else if (act === 'export') {
    const blob = new Blob([JSON.stringify(db)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '六级词汇进度-' + todayKey() + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  }
  else if (act === 'import') { document.getElementById('fileIn').click(); }
  else if (act === 'reset') {
    if (confirm('确定清空全部学习进度？此操作不可撤销。')) { db = blank(); save(); applyTheme(); S.view = 'home'; render(); }
  }
  else if (act === 'showzh') {
    const zh = document.getElementById('zhHint');
    if (zh) zh.style.display = zh.style.display === 'none' ? 'block' : 'none';
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'answer') S.typed = e.target.value;
  if (e.target.id === 'libq') {
    S.libQuery = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const el = document.getElementById('libq');
    if (el) { el.focus(); el.setSelectionRange(pos, pos); }
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'setGoal') { db.set.goal = +e.target.value; save(); render(); }
  if (e.target.id === 'fileIn' && e.target.files && e.target.files[0]) {
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const d = JSON.parse(fr.result);
        if (!d.items) throw new Error('bad');
        db = { v: 1, items: d.items, log: d.log || {}, set: Object.assign(blank().set, d.set || {}) };
        save(); applyTheme(); toast('已导入进度'); render();
      } catch (err) { toast('文件格式不对，导入失败'); }
    };
    fr.readAsText(e.target.files[0]);
    e.target.value = '';
  }
});

/* ---------------- theme / boot ---------------- */
function applyTheme() {
  const t = db.set.theme || 'auto';
  const dark = t === 'dark' || (t === 'auto' && !matchMedia('(prefers-color-scheme: light)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  document.querySelector('meta[name=theme-color]').setAttribute('content', dark ? '#0d1017' : '#f6f7fb');
}
applyTheme();
if (matchMedia('(prefers-color-scheme: light)').addEventListener) {
  matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (db.set.theme === 'auto') applyTheme(); });
}
render();
</script>
